aid: accuvein
name: AccuVein
description: >-
  AccuVein, Inc. is a Medford, New York medical device manufacturer that builds handheld,
  near-infrared (NIR) vein visualization systems used by clinicians for peripheral vascular
  access. Its AV500 and AV600 devices project a real-time green image of superficial
  vasculature onto the surface of the skin, letting nurses and phlebotomists see veins,
  valves and bifurcations that are not visible to the naked eye before a needle stick. The
  company sells into acute care, non-acute care and aesthetics, and supports the product
  line with published instructions for use, product manuals, troubleshooting guidance and a
  knowledge center. AccuVein is a hardware business: as of this profile it publishes no
  developer program, no public API, no SDK and no machine-readable API description.
